apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: healthcare-security-alerts
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
  - name: healthcare-security
    rules:
    - alert: FailedLoginsHigh
      expr: sum(increase(failed_logins_total[5m])) > 3
      for: 30s
      labels:
        severity: warning
      annotations:
        summary: "Possible brute-force: {{ $value | printf \"%.0f\" }} failed logins in 5m"
    - alert: UnauthorizedAccessAttempts
      expr: sum(increase(unauthorized_requests_total[5m])) > 3
      for: 30s
      labels:
        severity: critical
      annotations:
        summary: "{{ $value | printf \"%.0f\" }} unauthorized API requests in 5m"
    - alert: HighCPUUsage
      expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[2m])) * 100) > 80
      for: 2m
      labels:
        severity: warning
      annotations:
        summary: "CPU above 80% on {{ $labels.instance }}"
    - alert: HealthcareAppDown
      expr: absent(up{job="healthcare-app"} == 1)
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "No healthy healthcare-app target"
